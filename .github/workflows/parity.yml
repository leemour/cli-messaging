name: Parity

# Each CLI checks only the manifest of the shared-package version it pins, so a row this repository
# gets wrong shows up there weeks later. This checks both CLIs' main against this manifest now.
# Their main, not npm: a row lists a CLI in `in` once its main has it, and a release always trails that.
on:
  pull_request:
    paths:
      - parity.json
      - src/parity/**
      - .github/workflows/parity.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli: [max, tg]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: shared
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WireCatLabs/${{ matrix.cli }}-cli
          path: cli
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: shared/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            shared/pnpm-lock.yaml
            cli/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: shared
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: cli
      - run: node cli/dist/bin/${{ matrix.cli }}.js commands --json | node shared/dist/parity/bin.js ${{ matrix.cli }}

  wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: shared
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WireCatLabs/max-cli
          path: max
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WireCatLabs/tg-cli
          path: tg
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: shared/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            shared/pnpm-lock.yaml
            max/pnpm-lock.yaml
            tg/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: shared
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: max
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: tg
      - run: |
          node max/dist/bin/max.js commands --json > max.json
          node tg/dist/bin/tg.js commands --json > tg.json
          node shared/dist/parity/bin.js wording max.json tg.json

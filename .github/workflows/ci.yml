name: Full validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: WireCatLabs/cli-core/.github/workflows/node-ci.yml@b36a30fb6037b457001bd2db860949f64512ecdd # v0.17.3
    with:
      checks: |
        pnpm docs:check
        pnpm schema:check
        pnpm check:dist
        pnpm check:agent-process
      # The smoke runs the sources; only the second line loads the Bun half of the Drizzle bundle in dist.
      bun-run: |
        pnpm smoke:bun
        pnpm build && bun scripts/check-dist.ts

  old-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The last official Node whose SQLite has no FTS5 (measured 2026-10-01).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.15.0
      - run: node scripts/check-old-node.mjs

  sqlite-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A distribution's Node on a SQLite too old for the store (3.42, built with Node's features so
      # Node starts at all): the command must start again on ours, and a TERM to it must end both.
      - run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:26.04 sh -ec '
            apt-get update >/dev/null && apt-get install -y nodejs gcc curl unzip procps >/dev/null
            curl -sSfL https://www.sqlite.org/2023/sqlite-amalgamation-3420000.zip -o /tmp/old.zip
            unzip -q /tmp/old.zip -d /tmp && mkdir /old
            gcc -O1 -fPIC -shared -Wl,-soname,libsqlite3.so.0 -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_FTS3 \
              -DSQLITE_ENABLE_SESSION -DSQLITE_ENABLE_PREUPDATE_HOOK -DSQLITE_ENABLE_COLUMN_METADATA \
              -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_GEOPOLY -DSQLITE_ENABLE_RBU -DSQLITE_ENABLE_DBSTAT_VTAB \
              -DSQLITE_ENABLE_MATH_FUNCTIONS /tmp/sqlite-amalgamation-3420000/sqlite3.c -o /old/libsqlite3.so.0 -lm
            LD_LIBRARY_PATH=/old node scripts/check-sqlite-restart.mjs /old
            LD_LIBRARY_PATH=/old node scripts/check-sqlite-restart.mjs /old wait >/tmp/out 2>&1 & parent=$!
            for _ in $(seq 30); do grep -q "^restart:" /tmp/out && break; sleep 1; done
            grep -q "^restart:" /tmp/out || { cat /tmp/out; echo "the restarted command never ran"; exit 1; }
            # By name, not by command line: the command line of this shell names the script too.
            [ "$(pgrep -x node | wc -l)" = 2 ] || { echo "expected the parent and the restarted command"; exit 1; }
            kill -TERM $parent; sleep 2
            if pgrep -x node; then echo "TERM to the parent left a process"; exit 1; fi
            echo "TERM ended the parent and the restarted command"'

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A warning, never a failure: bin/release takes the next free version itself (2026-09-29).
      - name: version above main and npm
        continue-on-error: true
        run: |
          pr=$(node -p 'require("./package.json").version')
          git fetch -q --depth=1 origin main
          main=$(git show FETCH_HEAD:package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          [ "$pr" != "$main" ] || exit 0
          name=$(node -p 'require("./package.json").name')
          latest=$(npm view "$name" version 2>/dev/null || true)
          floor=$(printf '%s\n%s\n' "$main" "$latest" | sort -V | tail -1)
          versions=$(npm view "$name" versions --json 2>/dev/null || true)
          next=$(node scripts/next-version.mjs "$pr" "$floor" "$versions")
          [ "$next" != "$pr" ] || exit 0
          echo "::warning file=package.json::version $pr is not above both main ($main) and npm's latest ($latest)" \
            "— bin/release will publish it as $next"

  parity:
    uses: ./.github/workflows/parity.yml

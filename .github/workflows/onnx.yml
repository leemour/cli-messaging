name: ONNX
# Builds @wirecat/cli-messaging-onnx (packages/onnx), runs a model through it on every system under
# Node and Bun, and publishes it when started by hand with `publish` — npm trusts this file by name.
on:
  schedule:
    - cron: "27 3 1 * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the package to npm"
        type: boolean
        default: false

permissions: {}

jobs:
  security:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-core/.github/workflows/release-checks.yml@1183bfb970330989ad8acec917b14b7e6187de15
    with:
      languages: '["actions","javascript-typescript","c-cpp"]'

  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: packages/onnx/build.sh
      - run: npm pack ./packages/onnx
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: wirecat-cli-messaging-onnx-*.tgz
          if-no-files-found: error

  probe:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: probe
      - name: install the package as a user would
        working-directory: probe
        run: |
          echo '{"type":"module"}' > package.json
          npm install --no-audit --no-fund ./wirecat-cli-messaging-onnx-*.tgz
          cp ../packages/onnx/probe.mjs .
          mkdir test && cp ../packages/onnx/test/multiply.onnx test/
      - working-directory: probe
        run: node probe.mjs
      - working-directory: probe
        run: bun probe.mjs

  publish:
    needs: [probe, security]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - run: npm publish wirecat-cli-messaging-onnx-*.tgz --access public --provenance
